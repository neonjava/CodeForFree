<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeForFree</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#e9edf4;background:#0c1017}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:240px 1fr;height:100vh}.side{background:#121924;border-right:1px solid #283244;padding:22px;overflow:auto}.brand{font-size:19px;font-weight:750;letter-spacing:-.04em;margin-bottom:28px}.brand span{color:#75ddb2}.muted{color:#98a6b8;font-size:12px}#new{width:100%;border:1px solid #3f735e;background:#1d4939;color:#d5fce8;border-radius:9px;padding:10px;margin:14px 0 22px}.project{display:block;width:100%;text-align:left;border:0;background:transparent;color:#b9c6d7;padding:11px;border-radius:8px}.project:hover,.project.active{background:#263348;color:#fff}main{min-width:0;display:flex;flex-direction:column}.top{border-bottom:1px solid #283244;padding:17px 24px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:16px;margin:0}.status{font-size:12px;color:#85caa8}.messages{max-width:880px;width:100%;margin:auto;padding:28px 24px;overflow:auto;flex:1}.empty{display:grid;place-items:center;height:100%;text-align:center;color:#aebbd0}.empty h2{color:#f0f5fb;margin-bottom:4px}.message{white-space:pre-wrap;line-height:1.58;margin:0 0 20px;padding:17px 19px;border:1px solid #29374a;border-radius:12px;background:#151e2a}.message.user{background:#1c3032;border-color:#2d5550}.label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#85caa8;margin-bottom:9px}.compose{max-width:880px;width:100%;margin:auto;padding:12px 24px 24px}.controls{display:flex;gap:9px;margin-bottom:10px}.controls select,.controls input{background:#192230;border:1px solid #354257;color:#e9edf4;border-radius:8px;padding:9px}.controls input{flex:1;min-width:0}.entry{display:flex;gap:10px;background:#192230;border:1px solid #354257;border-radius:12px;padding:9px}.entry textarea{background:none;color:#fff;border:0;outline:0;resize:vertical;min-height:70px;flex:1;padding:7px}.entry button{align-self:end;border:0;border-radius:8px;background:#7de2b0;color:#09251b;font-weight:700;padding:10px 17px}.error{color:#ffb1a7;font-size:13px;min-height:18px;margin-top:8px}@media(max-width:700px){.app{grid-template-columns:1fr}.side{height:auto;padding:12px;border-right:0;border-bottom:1px solid #283244}.brand{margin:0 0 9px}.side .muted{display:none}#new{width:auto;margin:0 0 8px}.projects{display:flex;overflow:auto}.project{white-space:nowrap;width:auto}.top{padding:12px}.messages{padding:14px}.compose{padding:10px}.controls{flex-wrap:wrap}.controls input{flex-basis:100%}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Code<span>ForFree</span></div><div class="muted">YOUR LOCAL CODING WORKSPACE</div><button id="new">+ New project</button><div class="projects" id="projects"></div></aside><main><header class="top"><h1 id="title">Choose a project</h1><div class="status">● Local workspace</div></header><div class="messages" id="messages"><div class="empty"><div><h2>Build with your models</h2><p>Create a project to start a coding conversation.</p></div></div></div><div class="compose"><div class="controls"><select id="mode" aria-label="Mode"><option value="ask">Ask</option><option value="plan">Plan</option><option value="code">Code</option></select><input id="model" aria-label="Model" placeholder="Model name, e.g. llama3.2"></div><div class="entry"><textarea id="prompt" aria-label="Message" placeholder="Ask about your project... (Ctrl+Enter to send)"></textarea><button id="send">Send</button></div><div class="error" id="error"></div></div></main></div><script>
let current=null,projects=[];const $=id=>document.getElementById(id);async function api(path,options){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...options});if(!r.ok)throw Error(await r.text());return r.json()};function renderProjects(){ $('projects').replaceChildren(...projects.map(p=>{const b=document.createElement('button');b.className='project'+(p.id===current?' active':'');b.textContent=p.name;b.onclick=()=>select(p.id);return b}))}function addMessage(m){const d=document.createElement('div');d.className='message '+m.role;const l=document.createElement('div');l.className='label';l.textContent=m.role+(m.mode?' · '+m.mode:'');const c=document.createElement('div');c.textContent=m.content;d.append(l,c);$('messages').append(d);$('messages').scrollTop=$('messages').scrollHeight}async function select(id){current=id;renderProjects();$('title').textContent=projects.find(p=>p.id===id)?.name||'Project';$('messages').replaceChildren();try{(await api(`/api/projects/${id}/messages`)).forEach(addMessage)}catch(e){$('error').textContent=e.message}}async function load(){try{projects=await api('/api/projects');renderProjects();if(projects.length)await select(projects[0].id)}catch(e){$('error').textContent=e.message}}$('new').onclick=async()=>{const name=prompt('Project name');if(!name)return;try{const p=await api('/api/projects',{method:'POST',body:JSON.stringify({name})});projects.unshift(p);select(p.id)}catch(e){$('error').textContent=e.message}};$('send').onclick=async()=>{if(!current){$('error').textContent='Create a project first.';return}const content=$('prompt').value.trim();if(!content)return;const mode=$('mode').value,model=$('model').value.trim();$('error').textContent='';$('send').disabled=true;try{const answer=await api(`/api/projects/${current}/chat`,{method:'POST',body:JSON.stringify({content,mode,model:model||null})});$('prompt').value='';await select(current);$('messages').scrollTop=$('messages').scrollHeight}catch(e){$('error').textContent=e.message}finally{$('send').disabled=false}};$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.ctrlKey)$('send').click()});load();
</script></body></html>
